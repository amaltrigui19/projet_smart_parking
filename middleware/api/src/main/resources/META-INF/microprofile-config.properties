# Vérification des JWT par MicroProfile JWT (WildFly), contrat §2.2.
# Émetteur attendu : doit être identique à GenerateurJwt.EMETTEUR (module iam).
mp.jwt.verify.issuer=smartparking
# Clé PUBLIQUE (la clé privée ne sert qu'à signer, dans le module iam).
# Fichier monté depuis server/jwt/ par docker-compose.yml. Se remplace par la variable
# d'environnement MP_JWT_VERIFY_PUBLICKEY_LOCATION.
mp.jwt.verify.publickey.location=file:/opt/smartparking/jwt/publique.pem
mp.jwt.verify.publickey.algorithm=RS256
