# JWT verification by MicroProfile JWT (WildFly).
# Expected issuer: must match the issuer of the IAM module.
mp.jwt.verify.issuer=smartparking
# Public keys come from the JWKS endpoint of the IAM module (key chosen by the "kid" of the token,
# key rotation followed automatically). The IAM runs in the same WildFly, hence the internal URL.
# Can be overridden by the MP_JWT_VERIFY_PUBLICKEY_LOCATION environment variable.
mp.jwt.verify.publickey.location=http://localhost:8080/api/.well-known/jwks.json
mp.jwt.verify.publickey.algorithm=RS256
