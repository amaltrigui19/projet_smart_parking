<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan en temps réel · Smart Parking</title>
  <meta name="theme-color" content="#0b5d5d">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/plan.css">
</head>
<!--
  PAGE DE DÉMO PROVISOIRE (sprint 4).
  Le plan SVG ci-dessous sera remplacé par celui d'Amal (généré à partir de GET /api/parking).
  Ce qui reste : js/temps-reel.js et la convention data-place="A1" + classes libre / occupee / reservee.
  Accessible aux deux rôles (pas de data-role) ; masquée tant que la session n'est pas vérifiée (js/espace.js).
-->
<body hidden>
  <header class="entete">
    <img src="icons/icon-192.png" alt="" width="40" height="40">
    <h1>Smart Parking</h1>
    <span id="statut-temps-reel" class="pastille statut-connexion" role="status">Connexion…</span>
  </header>

  <div class="barre-session">
    <span>Plan en temps réel · <strong id="nom-utilisateur"></strong></span>
    <button id="btn-deconnexion" class="bouton-secondaire" type="button">Se déconnecter</button>
  </div>

  <main>
    <section class="accueil">
      <h2>Plan du parking</h2>
      <p>Les places changent de couleur dès que le serveur envoie un changement, sans recharger la page.</p>

      <p class="resume" aria-live="polite">
        <span><strong id="nb-libres">–</strong> libres</span>
        <span><strong id="nb-occupees">–</strong> occupées</span>
        <span><strong id="nb-reservees">–</strong> réservées</span>
      </p>

      <!-- Plan provisoire, à l'échelle du contrat §4.1 (1 unité = 1 cm, maquette de 60 × 40 cm). -->
      <div class="plan">
        <svg id="plan" viewBox="0 0 60 40" role="img" aria-labelledby="titre-plan">
          <title id="titre-plan">Plan du parking P1 : 8 places, A1 à A4 en haut, B1 à B4 en bas</title>
          <rect class="sol" x="0" y="0" width="60" height="40" rx="1"/>
          <rect class="allee" x="0" y="13" width="60" height="14"/>
          <rect class="interdit" x="50" y="13" width="10" height="14"/>
          <text class="repere" x="5.5" y="20">ENTRÉE</text>
          <text class="repere" x="55" y="20">SORTIE</text>

          <g data-place="A1"><title>A1 (PMR)</title><rect x="14" y="0" width="8" height="13"/>
            <text class="numero" x="18" y="5.5">A1</text><text class="type" x="18" y="10">PMR</text></g>
          <g data-place="A2"><title>A2</title><rect x="22" y="0" width="8" height="13"/>
            <text class="numero" x="26" y="5.5">A2</text></g>
          <g data-place="A3"><title>A3</title><rect x="30" y="0" width="8" height="13"/>
            <text class="numero" x="34" y="5.5">A3</text></g>
          <g data-place="A4"><title>A4</title><rect x="38" y="0" width="8" height="13"/>
            <text class="numero" x="42" y="5.5">A4</text></g>
          <g data-place="B1"><title>B1</title><rect x="14" y="27" width="8" height="13"/>
            <text class="numero" x="18" y="34.5">B1</text></g>
          <g data-place="B2"><title>B2</title><rect x="22" y="27" width="8" height="13"/>
            <text class="numero" x="26" y="34.5">B2</text></g>
          <g data-place="B3"><title>B3</title><rect x="30" y="27" width="8" height="13"/>
            <text class="numero" x="34" y="34.5">B3</text></g>
          <g data-place="B4"><title>B4 (électrique)</title><rect x="38" y="27" width="8" height="13"/>
            <text class="numero" x="42" y="32.5">B4</text><text class="type" x="42" y="37">ÉLEC</text></g>
        </svg>
      </div>

      <ul class="legende">
        <li><span class="carre libre"></span>Libre</li>
        <li><span class="carre occupee"></span>Occupée</li>
        <li><span class="carre reservee"></span>Réservée</li>
      </ul>

      <h3>Derniers changements</h3>
      <ul id="journal" class="journal"></ul>
    </section>
  </main>

  <footer class="pied">Smart Parking · Cloud of Things · SUP'COM</footer>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/espace.js"></script>
  <script type="module" src="js/plan-temps-reel.js"></script>
</body>
</html>
