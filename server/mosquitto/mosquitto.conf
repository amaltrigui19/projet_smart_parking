# Mosquitto : MQTT en TLS uniquement (port 8883), sans connexion anonyme.
# Comptes et droits : contrat docs/contrats.md, section 5.3.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S

listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

allow_anonymous false
# Créés au démarrage par demarrer.sh à partir des variables du fichier .env
password_file /mosquitto/data/securite/passwd
acl_file /mosquitto/data/securite/acl
