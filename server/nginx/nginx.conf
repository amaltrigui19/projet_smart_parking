
# Nginx : HTTPS devant les deux frontends et l'API.
#   /             front office (conducteurs)  -> frontend/front-office/
#   /admin/       back office (opérateurs)    -> frontend/back-office/
#   /shared/      code et styles communs      -> frontend/shared/
#   /api/         API REST et WebSocket (WildFly, api.war)
#   /.well-known/jwks.json   clés publiques des JWT (module IAM, contrat §2.2)
# Les certificats sont dans server/certs/ (fullchain.pem, privkey.pem) :
#   - en local : générés par scripts/generate-certificates.sh
#   - sur la VM : copiés depuis Let's Encrypt par scripts/certbot-deploy-hook.sh

server_tokens off;

# Pour le WebSocket (/api/ws/...)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80 : défi Let's Encrypt, sinon redirection vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443 : le site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Front office : application des conducteurs (frontend/front-office/)
    root  /usr/share/nginx/html/front-office;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Back office : application des opérateurs (frontend/back-office/), dossier et service worker séparés
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        alias /usr/share/nginx/html/back-office/;
        index index.html;
        add_header X-Robots-Tag "noindex" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Code et styles communs aux deux applications (frontend/shared/)
    location /shared/ {
        alias /usr/share/nginx/html/shared/;
    }

    # JWKS : clés publiques des JWT, publiées par le module IAM (contrat §2.2). Public, sans jeton.
    location = /.well-known/jwks.json {
        proxy_pass http://wildfly:8080/api/.well-known/jwks.json;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket temps réel (contrat 1.4)
    location /api/ws/ {
        proxy_pass http://wildfly:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # API REST (WildFly, application api.war)
    location /api/ {
        proxy_pass http://wildfly:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
