# Smart Parking : serveur complet (Nginx HTTPS, Mosquitto TLS, MongoDB, WildFly)
# Le même fichier sert en local (voie B) et sur la VM cloud (voie A).
# Procédure : docs/installation-serveur.md
#
#   cd server
#   cp .env.example .env        # puis remplir les mots de passe
#   ./scripts/generate-certificates.sh
#   ./scripts/generate-jwt-keys.sh
#   docker compose up -d --build

name: smartparking

services:

  # Reverse proxy HTTPS : sert les deux frontends et transmet /api à WildFly
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - wildfly

  # Broker MQTT en TLS (8883), comptes « pi » et « server » avec mot de passe
  mqtt:
    image: eclipse-mosquitto:2.0.23
    restart: unless-stopped
    ports:
      - "8883:8883"
    environment:
      MQTT_PASSWORD_PI: ${MQTT_PASSWORD_PI:?à définir dans .env}
      MQTT_PASSWORD_SERVER: ${MQTT_PASSWORD_SERVER:?à définir dans .env}
    command: ["sh", "/mosquitto/config/start.sh"]
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - ./certs:/mosquitto/certs:ro
      - mqtt-data:/mosquitto/data

  # Base de données, données gardées dans un volume Docker
  mongo:
    image: mongo:9.0.8
    restart: unless-stopped
    # Par défaut accessible seulement depuis la machine elle-même (voir .env)
    ports:
      - "${MONGO_HOST_PORT:-127.0.0.1:27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?à définir dans .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?à définir dans .env}
    # Cache limité pour tenir sur une VM de 2 Go
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Serveur d'application Jakarta EE : api.war (API REST + module IAM), GET /api/health
  wildfly:
    # Sur la VM : image construite par GitHub Actions et téléchargée depuis GHCR (WILDFLY_IMAGE est
    # écrit dans .env par scripts/deploy.sh). En local : non défini, « docker compose up -d --build » la construit.
    image: ${WILDFLY_IMAGE:-smartparking-wildfly:local}
    build:
      context: ../middleware
      # frontend/ est copié dans l'image (ROOT.war) : WildFly sert les deux PWA
      additional_contexts:
        frontend: ../frontend
    restart: unless-stopped
    # Pas de port publié : on passe toujours par Nginx en HTTPS
    environment:
      MONGO_HOST: mongo
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MQTT_HOST: mqtt
      MQTT_PASSWORD_SERVER: ${MQTT_PASSWORD_SERVER}
      # JWT (contrat §2.2) : dossier des clés <kid>.pem créées par scripts/generate-jwt-keys.sh.
      # L'IAM signe avec la plus récente et publie toutes les clés publiques sur /.well-known/jwks.json.
      JWT_KEYS_DIR: /opt/smartparking/jwt/keys
      # Compte OPERATOR de démo, créé au démarrage s'il n'existe pas (laisser vide pour ne rien créer)
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
    volumes:
      # Dossier jwt/ (ignoré par Git)
      - ./jwt:/opt/smartparking/jwt:ro
    depends_on:
      - mongo
      - mqtt

# Noms Docker fixés : ce sont les volumes déjà créés sur la VM (données conservées).
volumes:
  mongo-data:
    name: smartparking_mongo-donnees
  mqtt-data:
    name: smartparking_mqtt-donnees
