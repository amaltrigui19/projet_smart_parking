# Nginx : HTTPS devant la PWA et l'API.
# Les certificats sont dans infra/certs/ (fullchain.pem, privkey.pem) :
#   - en local : générés par scripts/generer-certificats.sh
#   - sur la VM : copiés depuis Let's Encrypt par scripts/certbot-deploy-hook.sh

server_tokens off;

# Pour le WebSocket (/api/ws/...)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80 : défi Let's Encrypt, sinon redirection vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443 : le site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # PWA (fichiers statiques du dossier pwa/)
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # WebSocket temps réel (contrat 1.4)
    location /api/ws/ {
        proxy_pass http://wildfly:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # API REST (WildFly, application api.war)
    location /api/ {
        proxy_pass http://wildfly:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
